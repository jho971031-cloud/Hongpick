name: Collect BTC backtest data (October 1-7)
on:
  workflow_dispatch:
  push:
    branches: [codex/btc-october-backtest]
    paths:
      - .github/workflows/btc-backtest-data.yml
      - tools/collect_btc_backtest.py
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Collect and validate public archives
        run: |
          python - <<'PYCOLLECT'
          """Collect public Binance archives for an offline backtest; never places orders."""
          import concurrent.futures
          import csv
          import datetime as dt
          import hashlib
          import io
          import json
          import pathlib
          import time
          import urllib.request
          import zipfile
          
          OUT = pathlib.Path('btc-backtest-data')
          OUT.mkdir(exist_ok=True)
          UTC = dt.timezone.utc
          START = dt.datetime(2026, 9, 30, 15, tzinfo=UTC)
          END = dt.datetime(2026, 10, 7, 15, tzinfo=UTC)
          WARMUP = START - dt.timedelta(days=3)
          manifest = {'symbol': 'BTCUSDT', 'start_utc': START.isoformat(),
                      'end_utc_exclusive': END.isoformat(), 'timezone': 'Asia/Seoul',
                      'warmup_start_utc': WARMUP.isoformat(), 'files': [], 'errors': []}
          
          
          def fetch(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'HongPick-offline-research/1.0'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          return response.read()
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(1 + attempt)
          
          
          def collect(task):
              kind, day = task
              name = f'BTCUSDT-1m-{day}.zip'
              route = {'spot': 'spot/daily/klines',
                       'futures': 'futures/um/daily/klines',
                       'mark': 'futures/um/daily/markPriceKlines'}[kind]
              url = f'https://data.binance.vision/data/{route}/BTCUSDT/1m/{name}'
              archive = fetch(url)
              checksum = fetch(url + '.CHECKSUM').decode().split()[0].lower()
              if hashlib.sha256(archive).hexdigest() != checksum:
                  raise ValueError(f'Checksum mismatch: {url}')
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  members = [n for n in z.namelist() if n.endswith('.csv')]
                  if len(members) != 1:
                      raise ValueError(f'Unexpected archive contents: {url}')
                  raw = z.read(members[0]).decode('utf-8-sig')
              rows = []
              for row in csv.reader(io.StringIO(raw)):
                  if not row or not row[0].isdigit():
                      continue
                  timestamp = int(row[0])
                  # Spot archives since 2025 use microseconds; futures use milliseconds.
                  stamp = timestamp // (1_000_000 if timestamp > 10**14 else 1_000)
                  if WARMUP.timestamp() <= stamp < END.timestamp():
                      o, h, l, c, v = map(float, row[1:6])
                      if not (0 < l <= min(o, c) <= max(o, c) <= h and v >= 0):
                          raise ValueError(f'Invalid OHLCV: {url} at {stamp}')
                      rows.append({'time': stamp, 'open': o, 'high': h, 'low': l, 'close': c, 'volume': v})
              return kind, rows, {'kind': kind, 'date': str(day), 'source': url,
                                   'sha256': checksum, 'rows': len(rows)}
          
          
          days = []
          day = WARMUP.date()
          while day <= END.date():
              days.append(day)
              day += dt.timedelta(days=1)
          combined = {kind: [] for kind in ('spot', 'futures', 'mark')}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              tasks = {pool.submit(collect, (kind, day)): (kind, day)
                       for kind in combined for day in days}
              for future in concurrent.futures.as_completed(tasks):
                  kind, day = tasks[future]
                  try:
                      kind, rows, entry = future.result()
                      combined[kind].extend(rows)
                      manifest['files'].append(entry)
                      print(f'OK {kind} {day}: {len(rows)} minutes', flush=True)
                  except Exception as exc:
                      error = {'kind': kind, 'date': str(day), 'error': str(exc)}
                      manifest['errors'].append(error)
                      print(f'ERROR {error}', flush=True)
          
          expected = int((END - WARMUP).total_seconds() // 60)
          coverage = {}
          for kind, rows in combined.items():
              unique = {r['time']: r for r in rows}
              rows = [unique[t] for t in sorted(unique)]
              gaps = sum(b['time'] != a['time'] + 60 for a, b in zip(rows, rows[1:]))
              complete = (len(rows) == expected and not gaps
                          and rows[0]['time'] == int(WARMUP.timestamp())
                          and rows[-1]['time'] == int(END.timestamp()) - 60)
              coverage[kind] = {'minutes': len(rows), 'expected_minutes': expected,
                                'gaps': gaps, 'complete': complete}
              (OUT / f'{kind}-1m.json').write_text(json.dumps(rows, separators=(',', ':')))
              bars = []
              for index in range(0, len(rows), 15):
                  group = rows[index:index + 15]
                  if len(group) != 15 or group[0]['time'] % 900 or group[-1]['time'] - group[0]['time'] != 840:
                      continue
                  bars.append({'time': group[0]['time'], 'open': group[0]['open'],
                               'high': max(r['high'] for r in group), 'low': min(r['low'] for r in group),
                               'close': group[-1]['close'], 'volume': sum(r['volume'] for r in group)})
              (OUT / f'{kind}-15m.json').write_text(json.dumps(bars, separators=(',', ':')))
          manifest['coverage'] = coverage
          manifest['collected_at_utc'] = dt.datetime.now(UTC).isoformat()
          (OUT / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print('COVERAGE ' + json.dumps(coverage), flush=True)
          summary = '\n'.join(f'- {kind}: {value}' for kind, value in coverage.items())
          import os
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('# BTC October 1–7 data collection\n\n' + summary + '\n\nNo trades or backtest results generated by this collection step.\n')
          if not coverage['spot']['complete'] or not coverage['futures']['complete']:
              raise SystemExit('Required market data incomplete; do not calculate a result from this output.')
          PYCOLLECT
      - name: Save original chart algorithm for reproducibility
        if: always()
        run: |
          mkdir -p btc-backtest-data
          cp charts.js btc-backtest-data/charts-source.js
          git rev-parse HEAD > btc-backtest-data/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-october-1-7-data
          path: btc-backtest-data/
          retention-days: 30
