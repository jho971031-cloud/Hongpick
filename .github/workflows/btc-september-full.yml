name: BTC full September protected profit replay
'on':
  push:
    branches:
    - codex/btc-october-backtest
    paths:
    - .github/workflows/btc-september-full.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Collect and verify full September market data
      run: "python - <<'PYCOLLECT'\n\"\"\"Collect public Binance archives for an offline backtest; never places orders.\"\"\"\nimport concurrent.futures\nimport csv\nimport datetime as dt\nimport hashlib\n\
        import io\nimport json\nimport pathlib\nimport time\nimport urllib.request\nimport zipfile\n\nOUT = pathlib.Path('tick-input')\nOUT.mkdir(exist_ok=True)\nUTC = dt.timezone.utc\nSTART = dt.datetime(2026,\
        \ 8, 31, 15, tzinfo=UTC)\nEND = dt.datetime(2026, 9, 30, 15, tzinfo=UTC)\nWARMUP = START - dt.timedelta(days=3)\nmanifest = {'symbol': 'BTCUSDT', 'start_utc': START.isoformat(),\n            'end_utc_exclusive':\
        \ END.isoformat(), 'timezone': 'Asia/Seoul',\n            'warmup_start_utc': WARMUP.isoformat(), 'files': [], 'errors': []}\n\n\ndef fetch(url):\n    for attempt in range(3):\n        try:\n  \
        \          req = urllib.request.Request(url, headers={'User-Agent': 'HongPick-offline-research/1.0'})\n            with urllib.request.urlopen(req, timeout=25) as response:\n                return\
        \ response.read()\n        except Exception:\n            if attempt == 2:\n                raise\n            time.sleep(1 + attempt)\n\n\ndef collect(task):\n    kind, day = task\n    name = f'BTCUSDT-1m-{day}.zip'\n\
        \    route = {'spot': 'spot/daily/klines',\n             'futures': 'futures/um/daily/klines',\n             'mark': 'futures/um/daily/markPriceKlines'}[kind]\n    url = f'https://data.binance.vision/data/{route}/BTCUSDT/1m/{name}'\n\
        \    archive = fetch(url)\n    checksum = fetch(url + '.CHECKSUM').decode().split()[0].lower()\n    if hashlib.sha256(archive).hexdigest() != checksum:\n        raise ValueError(f'Checksum mismatch:\
        \ {url}')\n    with zipfile.ZipFile(io.BytesIO(archive)) as z:\n        members = [n for n in z.namelist() if n.endswith('.csv')]\n        if len(members) != 1:\n            raise ValueError(f'Unexpected\
        \ archive contents: {url}')\n        raw = z.read(members[0]).decode('utf-8-sig')\n    rows = []\n    for row in csv.reader(io.StringIO(raw)):\n        if not row or not row[0].isdigit():\n    \
        \        continue\n        timestamp = int(row[0])\n        # Spot archives since 2025 use microseconds; futures use milliseconds.\n        stamp = timestamp // (1_000_000 if timestamp > 10**14\
        \ else 1_000)\n        if WARMUP.timestamp() <= stamp < END.timestamp():\n            o, h, l, c, v = map(float, row[1:6])\n            if not (0 < l <= min(o, c) <= max(o, c) <= h and v >= 0):\n\
        \                raise ValueError(f'Invalid OHLCV: {url} at {stamp}')\n            rows.append({'time': stamp, 'open': o, 'high': h, 'low': l, 'close': c, 'volume': v})\n    return kind, rows, {'kind':\
        \ kind, 'date': str(day), 'source': url,\n                         'sha256': checksum, 'rows': len(rows)}\n\n\ndays = []\nday = WARMUP.date()\nwhile day <= END.date():\n    days.append(day)\n  \
        \  day += dt.timedelta(days=1)\ncombined = {kind: [] for kind in ('spot', 'futures', 'mark')}\nwith concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:\n    tasks = {pool.submit(collect,\
        \ (kind, day)): (kind, day)\n             for kind in combined for day in days}\n    for future in concurrent.futures.as_completed(tasks):\n        kind, day = tasks[future]\n        try:\n    \
        \        kind, rows, entry = future.result()\n            combined[kind].extend(rows)\n            manifest['files'].append(entry)\n            print(f'OK {kind} {day}: {len(rows)} minutes', flush=True)\n\
        \        except Exception as exc:\n            error = {'kind': kind, 'date': str(day), 'error': str(exc)}\n            manifest['errors'].append(error)\n            print(f'ERROR {error}', flush=True)\n\
        \nexpected = int((END - WARMUP).total_seconds() // 60)\ncoverage = {}\nfor kind, rows in combined.items():\n    unique = {r['time']: r for r in rows}\n    rows = [unique[t] for t in sorted(unique)]\n\
        \    gaps = sum(b['time'] != a['time'] + 60 for a, b in zip(rows, rows[1:]))\n    complete = (len(rows) == expected and not gaps\n                and rows[0]['time'] == int(WARMUP.timestamp())\n\
        \                and rows[-1]['time'] == int(END.timestamp()) - 60)\n    coverage[kind] = {'minutes': len(rows), 'expected_minutes': expected,\n                      'gaps': gaps, 'complete': complete}\n\
        \    (OUT / f'{kind}-1m.json').write_text(json.dumps(rows, separators=(',', ':')))\n    bars = []\n    for index in range(0, len(rows), 15):\n        group = rows[index:index + 15]\n        if len(group)\
        \ != 15 or group[0]['time'] % 900 or group[-1]['time'] - group[0]['time'] != 840:\n            continue\n        bars.append({'time': group[0]['time'], 'open': group[0]['open'],\n              \
        \       'high': max(r['high'] for r in group), 'low': min(r['low'] for r in group),\n                     'close': group[-1]['close'], 'volume': sum(r['volume'] for r in group)})\n    (OUT / f'{kind}-15m.json').write_text(json.dumps(bars,\
        \ separators=(',', ':')))\nmanifest['coverage'] = coverage\nmanifest['collected_at_utc'] = dt.datetime.now(UTC).isoformat()\n(OUT / 'manifest.json').write_text(json.dumps(manifest, indent=2))\n\
        print('COVERAGE ' + json.dumps(coverage), flush=True)\nsummary = '\\n'.join(f'- {kind}: {value}' for kind, value in coverage.items())\nimport os\nif os.environ.get('GITHUB_STEP_SUMMARY'):\n    with\
        \ open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:\n        f.write('# BTC September 1\u201330 data collection\\n\\n' + summary + '\\n\\nNo trades or backtest results generated by this collection\
        \ step.\\n')\nif not all(v['complete'] for v in coverage.values()):\n    raise SystemExit('Required market data incomplete; do not calculate a result from this output.')\nPYCOLLECT\n"
    - name: Prepare unchanged signals and protected profit exits
      run: "cp charts.js tick-input/charts-source.js\ngit rev-parse HEAD > tick-input/source-commit.txt\ncat > tick-replay.cjs <<'JSCODE'\nconst fs=require('fs'),vm=require('vm'),readline=require('readline');\n\
        const input='tick-input/',out='tick-output/';fs.mkdirSync(out,{recursive:true});\nconst read=n=>JSON.parse(fs.readFileSync(input+n+'.json'));\nconst manifest=read('manifest'),bars=read('futures-15m'),mins=read('futures-1m'),marks=read('mark-1m');\n\
        const START=Date.parse(manifest.start_utc)/1000,END=Date.parse(manifest.end_utc_exclusive)/1000;\nconst box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync(input+'charts-source.js','utf8'),box);\n\
        const I=box.window.HongIndicators,rsis=new Map(I.rsi(bars).map(r=>[r.time,r.value])),signals=new Map();\nfor(let i=288;i<bars.length;i++){\n const history=bars.slice(0,i),rsi=rsis.get(history.at(-1).time);\n\
        \ if(rsi>30&&rsi<70)continue;\n signals.set(bars[i].time,{rsi,channels:['high','low'].map(m=>I.intradayFibonacci(history,m)).filter(Boolean).map(c=>{\n  const [a,b,d]=c.anchors,slope=Math.log(b.price/a.price)/((b.time-a.time)/900);\n\
        \  return {...c,origin:a.price,epoch:a.time,slope,width:Math.log(d.price/a.price)-slope*(d.time-a.time)/900};\n })});\n}\nconst ratios=[0,.5,1,1.5,2,2.5,3];\nconst levels=(c,t)=>ratios.map(r=>c.origin*Math.exp(c.slope*(t-c.epoch)/900+r*c.width)).sort((a,b)=>a-b);\n\
        const FEE=.0005,MMR=.004;\nlet peakMark=1000,maxMarkDD=0;\nfunction markSnapshot(){if(minuteKey===null)return;const m=markMap.get(minuteKey);if(!m)throw Error('Missing mark');const equity=cash+(pos?pos.margin+pos.side*(pos.qty*m.close-pos.cost):0);peakMark=Math.max(peakMark,equity);maxMarkDD=Math.max(maxMarkDD,(peakMark-equity)/peakMark);curve.push({time:minuteKey,equity});}\n\
        let cash=1000,pos=null,pending=null,previous=null,totalTicks=0,firstTick=null,lastTick=null;\nlet minHeadroom=Infinity,maxDD=0,peak=1000,minuteKey=null,ohlc=null,mismatches=0,checkedMinutes=0,ambiguousLiquidation=false,idGapCount=0,unusedIdCount=0;\n\
        const events=[],trades=[],curve=[],audit=[],minutesMap=new Map(mins.map(x=>[x.time,x])),markMap=new Map(marks.map(x=>[x.time,x]));\nconst record=(obj)=>{events.push(obj);audit.push({event:obj,previousTick:previous});};\n\
        function finishMinute(){\n if(!ohlc)return;markSnapshot();\n const expected=minutesMap.get(minuteKey);checkedMinutes++;\n if(!expected||(['open','high','low','close'].some(k=>Math.abs(expected[k]-ohlc[k])>1e-6)||Math.abs(expected.volume-ohlc.volume)>1e-5))mismatches++;\n\
        }\nfunction fill(tick){\n const order=pending;pending=null;\n if(order.type==='entry')pos={side:order.side,channel:order.channel,k:order.k,legMargin:cash*.1,startEquity:cash,margin:0,cost:0,qty:0,fees:0,legs:0,time:tick.time,rsi:order.rsi,firstPrice:tick.price};\n\
        \ if(order.type==='entry'||order.type==='average'){\n  const margin=pos.legMargin,notional=margin*100,existingPnl=pos.side*(pos.qty*tick.price-pos.cost);\n  if(cash+existingPnl<margin+notional*FEE){record({...tick,action:'order-rejected',type:order.type});if(!pos.legs)pos=null;else\
        \ pos.averageBlocked=true;return;}\n  const qty=notional/tick.price;cash-=margin+notional*FEE;pos.margin+=margin;pos.cost+=notional;pos.qty+=qty;pos.fees+=notional*FEE;pos.legs++;\n  if(order.type==='average')pos.k=order.k;\n\
        \  record({...tick,action:order.type,side:pos.side,legs:pos.legs,qty,margin,anchors:pos.channel.anchors,rsi:pos.rsi,trigger:order.trigger});\n }else {\n  const gross=pos.side*(pos.qty*tick.price-pos.cost),exitFee=pos.qty*tick.price*FEE,net=gross-exitFee-pos.fees;\n\
        \  cash+=pos.margin+gross-exitFee;\n  trades.push({side:pos.side===1?'LONG':'SHORT',entryTime:pos.time,exitTime:tick.time,entryPrice:pos.firstPrice,averagePrice:pos.cost/pos.qty,exitPrice:tick.price,exitTradeId:tick.id,legs:pos.legs,margin:pos.margin,pnl:net,fees:pos.fees+exitFee,reason:order.reason||(pos.legs===1?'roi100':'fee-inclusive-breakeven'),balance:cash,trigger:order.trigger,anchors:pos.channel.anchors});\n\
        \  record({...tick,action:'exit',legs:pos.legs,net,trigger:order.trigger});pos=null;\n }\n}\nfunction onTick(tick){\n if(tick.time<START||tick.time>=END)return;\n if(previous&&(tick.id<=previous.id||tick.time<previous.time))throw\
        \ Error('Raw trade order diagnostic '+JSON.stringify({previous,current:tick,idDelta:tick.id-previous.id,timeDelta:tick.time-previous.time}));\n if(previous&&tick.id>previous.id+1){idGapCount++;unusedIdCount+=tick.id-previous.id-1;}\n\
        \ totalTicks++;if(!firstTick)firstTick=tick;lastTick=tick;\n const minute=Math.floor(tick.time/60)*60;\n if(minute!==minuteKey){finishMinute();minuteKey=minute;ohlc={open:tick.price,high:tick.price,low:tick.price,close:tick.price,volume:tick.qty};}\n\
        \ else {ohlc.high=Math.max(ohlc.high,tick.price);ohlc.low=Math.min(ohlc.low,tick.price);ohlc.close=tick.price;ohlc.volume+=tick.qty;}\n let justFilled=false;\n if(pending){fill(tick);justFilled=true;}\n\
        \ if(pos){\n  const mark=markMap.get(minute);if(!mark)throw Error('No mark bound');\n  // Bounds are audit-only. Future minute extrema never select entries/exits.\n  const worst=pos.side===1?mark.low:mark.high,headroom=cash+pos.margin+pos.side*(pos.qty*worst-pos.cost)-pos.qty*worst*MMR;\n\
        \  minHeadroom=Math.min(minHeadroom,headroom);if(headroom<=0)ambiguousLiquidation=true;\n  const equity=cash+pos.margin+pos.side*(pos.qty*tick.price-pos.cost);peak=Math.max(peak,equity);maxDD=Math.max(maxDD,(peak-equity)/peak);\n\
        \  if(!justFilled){\n   const target=pos.legs===1?(pos.cost+pos.side*1*pos.margin)/pos.qty:(pos.side===1?(pos.cost+pos.fees)/(pos.qty*(1-FEE)):(pos.cost-pos.fees)/(pos.qty*(1+FEE)));\n   const gross=pos.side*(pos.qty*tick.price-pos.cost),net=gross-pos.qty*tick.price*FEE-pos.fees;\n\
        \   if(pos.legs===1&&gross/pos.legMargin>=.5&&!pos.protected){pos.protected=true;record({...tick,action:'protection-activated',netFloor:.25*pos.legMargin});}\n   if(pos.side===1?tick.price>=target:tick.price<=target)pending={type:'exit',trigger:tick,target};\n\
        \   else if(pos.legs===1&&pos.protected&&net<=.25*pos.legMargin)pending={type:'exit',reason:'profit-lock-net25',trigger:tick};\n   else if(pos.legs<2&&!pos.averageBlocked&&!pos.protected){\n   \
        \ const k=pos.k-pos.side;if(k>=0&&k<7){const price=levels(pos.channel,tick.time)[k];\n     if(pos.side===1?tick.price<=price:tick.price>=price)pending={type:'average',k,trigger:tick};}\n   }\n \
        \ }\n }else if(!justFilled&&previous){\n  const sig=signals.get(Math.floor(tick.time/900)*900);\n  if(sig){const side=sig.rsi<=30?1:-1,candidates=[];\n   for(const channel of sig.channels){const\
        \ now=levels(channel,tick.time),before=levels(channel,Math.max(previous.time,Math.floor(tick.time/900)*900));\n    for(let k=0;k<7;k++)if(side===1?(previous.price>before[k]&&tick.price<=now[k]):(previous.price<before[k]&&tick.price>=now[k]))candidates.push({channel,k});}\n\
        \   candidates.sort((a,b)=>b.channel.score-a.channel.score);\n   if(candidates.length)pending={type:'entry',side,...candidates[0],rsi:sig.rsi,trigger:tick};\n  }\n }\n \n previous=tick;\n}\nconst\
        \ stream=readline.createInterface({input:process.stdin,crlfDelay:Infinity});\nstream.on('line',line=>{const [id,time,price,qty]=line.split(',');onTick({id:Number(id),time:Number(time)/1000,price:Number(price),qty:Number(qty)});});\n\
        stream.on('close',()=>{\n finishMinute();const markPrice=marks.at(-1).close;\n const openPosition=pos?{side:pos.side===1?'LONG':'SHORT',entryTime:pos.time,entryPrice:pos.firstPrice,anchors:pos.channel.anchors,legs:pos.legs,margin:pos.margin,averagePrice:pos.cost/pos.qty,markPrice,unrealized:pos.side*(pos.qty*markPrice-pos.cost),entryFees:pos.fees}:null;\n\
        \ const final=cash+(openPosition?openPosition.margin+openPosition.unrealized:0);\n const ledger=1000+trades.reduce((s,t)=>s+t.pnl,0)+(openPosition?openPosition.unrealized-openPosition.entryFees:0);\n\
        \ if(Math.abs(ledger-final)>1e-6)throw Error('Ledger does not reconcile');\n if(checkedMinutes!==(END-START)/60||mismatches)throw Error('Raw trade OHLC does not match all requested minutes: '+checkedMinutes+'\
        \ mismatches '+mismatches);\n if(ambiguousLiquidation)throw Error('Mark-price bounds permit liquidation; higher-resolution mark data required. Do not report final return.');\n const summary={initial:1000,final,returnPct:(final/1000-1)*100,closedTrades:trades.length,wins:trades.filter(t=>t.pnl>1e-6).length,losses:trades.filter(t=>t.pnl<\
        \ -1e-6).length,breakevens:trades.filter(t=>Math.abs(t.pnl)<=1e-6).length,liquidationsRuledOut:true,minMaintenanceHeadroom:minHeadroom,maxMarkMinuteDrawdownPct:maxMarkDD*100,maxTradePriceDrawdownPct:maxDD*100,totalTicks,idGapCount,unusedIdCount,checkedMinutes,ohlcMismatches:mismatches,firstTick,lastTick,fees:trades.reduce((s,t)=>s+t.fees,0)+(openPosition?.entryFees||0)};\n\
        \ const result={summary,openPosition,trades,events,audit,curve,assumptions:{execution:'Signal on observed raw trade; market fill on next recorded raw trade. Hypothetical fills, zero latency beyond\
        \ next tick and no order-book impact.',signal:'Previous completed 15m Wilder RSI14, original Hong Pick high/low channel; anchors frozen at entry.',margin:'Cross; 100x; 10% initially plus one equal\
        \ 10% average; no stop.',exit:'First leg gross margin ROI +100%; after gross +50% activate fixed net +25% initial margin floor, no averaging after activation; after one average fee-inclusive breakeven.',fees:'0.05%\
        \ taker each fill; funding and slippage/order-book effects excluded.',mark:'1m actual mark low/high audit bounds rule out liquidation throughout the replay; no fabricated intra-minute mark path.'}};\n\
        \ fs.writeFileSync(out+'result.json',JSON.stringify(result,null,2));console.log('TICK_REPLAY_RESULT '+JSON.stringify(summary));\n});\n\nJSCODE\ncat > replay-raw.py <<'PYCODE'\nimport csv,datetime\
        \ as dt,hashlib,io,json,pathlib,subprocess,urllib.request,zipfile,time\nout=pathlib.Path('tick-output');out.mkdir(exist_ok=True)\nsources=[]\ndef fetch(url):\n for attempt in range(3):\n  try:\n\
        \   with urllib.request.urlopen(url,timeout=120) as r:return r.read()\n  except Exception:\n   if attempt==2:raise\n   time.sleep(2)\nproc=subprocess.Popen(['node','tick-replay.cjs'],stdin=subprocess.PIPE,text=True,bufsize=1024*1024)\n\
        try:\n for i in range(31):\n  day=dt.date(2026,8,31)+dt.timedelta(days=i)\n  url=f'https://data.binance.vision/data/futures/um/daily/trades/BTCUSDT/BTCUSDT-trades-{day}.zip'\n  print('Downloading\
        \ raw trades',day,flush=True)\n  data=fetch(url);sha=hashlib.sha256(data).hexdigest();expected=fetch(url+'.CHECKSUM').decode().split()[0]\n  assert sha==expected,'SHA256 mismatch'\n  count=0\n \
        \ with zipfile.ZipFile(io.BytesIO(data)) as z:\n   names=[n for n in z.namelist() if n.endswith('.csv')];assert len(names)==1\n   with z.open(names[0]) as f:\n    for row in csv.reader(io.TextIOWrapper(f)):\n\
        \     if not row or not row[0].isdigit():continue\n     # Raw USDT futures trades: id, price, qty, quote_qty, time, is_buyer_maker.\n     stamp=int(row[4]);stamp=stamp//1000 if stamp>10**14 else\
        \ stamp\n     if 1788188400000<=stamp<1790780400000:\n      proc.stdin.write(f'{row[0]},{stamp},{row[1]},{row[2]}\\n');count+=1\n  sources.append({'day':str(day),'url':url,'sha256':sha,'zip_bytes':len(data),'selected_trades':count})\n\
        \  (out/'raw-sources.json').write_text(json.dumps(sources,indent=2))\n  print('Processed',day,count,'trades',len(data),'ZIP bytes',flush=True)\n  del data\n proc.stdin.close();code=proc.wait();assert\
        \ code==0,f'Replay exited {code}'\nexcept BaseException:\n proc.kill();proc.wait();raise\nPYCODE"
    - name: Replay full September in actual exchange trade order
      run: python replay-raw.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: btc-september-full-protected-exit
        path: 'tick-input/

          tick-output/

          tick-replay.cjs

          replay-raw.py'
        retention-days: 30
